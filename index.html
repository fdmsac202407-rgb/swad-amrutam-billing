<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swad Amrutam Billing</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">

</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

<div class="loginBox">

<div class="logo">
<img src="https://www.smergers.com/media/franchiselogos/Swad_Amrutam_Chai_Logo.png">
</div>

<div class="loginTitle">
SWAD AMRUTAM CHAI
</div>

<input type="number" id="customerId" placeholder="Customer ID">

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button class="loginBtn" onclick="login()">
LOGIN
</button>

</div>

</div>

<!-- BILLING -->

<div id="billingPage">

<div class="topBar">

<h2 class="title">☕ Swad Amrutam Billing</h2>

<div id="customerHeader" class="customerHeader"></div>

<button class="logoutBtn" onclick="logout()">Logout</button>

</div>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="menuHeader" onclick="toggleMenu()">
<span>Menu</span>
<span>▼</span>
</div>

<div id="menuDropdown" class="menuDropdown">
</div>

<button
class="salesBtn"
onclick="openSalesDashboard()">
📊 Sales Dashboard
</button>

</div>

<!-- PRODUCTS -->

<div class="products">

<div class="searchArea">

<input
type="text"
id="searchBox"
class="searchBox"
placeholder="🔍 Search Products">

</div>

<div id="emptyState"></div>

<div id="productGrid" class="productGrid"></div>

<div id="productGrid" class="productGrid"></div>

<div id="emptyState" class="emptyState">

<div class="emptyIcon">🛒</div>

<h2>Your Cart Is Empty</h2>

<p>Select Category From Left Menu</p>

</div>

</div>

<!-- CART -->

<div class="cart">

<div class="cartHeader">

<h2 class="cartTitle">
🛒 Cart
</h2>

</div>

<div id="cartItems"></div>

<div class="totalBox">

<span>Total</span>

<span>
₹<span id="total">0</span>
</span>

</div>

<input
type="text"
id="customerName"
placeholder="Customer Name">

<input
type="number"
id="customerNumber"
placeholder="WhatsApp Number">

<button
class="actionBtn saveBtn"
onclick="saveBill()">
Save Bill
</button>

<button
class="actionBtn payBtn"
onclick="openPaymentPopup()">
Payment Mode
</button>

<button
class="actionBtn whatsappBtn"
onclick="sendWhatsApp()">
WhatsApp Bill
</button>

</div>

</div>

</div>

<!-- SIZE POPUP -->

<div class="popup" id="sizePopup">

<div class="popupBox">

<h2>Select Option</h2>

<div id="sizeOptions"></div>

<button
class="popupBtn"
style="background:red"
onclick="closeSizePopup()">
Close
</button>

</div>

</div>

<!-- PAYMENT POPUP -->

<div class="popup" id="paymentPopup">

<div class="popupBox">

<h2>Payment Mode</h2>

<button
class="popupBtn"
style="background:#00c853"
onclick="payUPI()">
UPI
</button>

<button
class="popupBtn"
style="background:#9c27b0"
onclick="showQR()">
QR
</button>

<button
class="popupBtn"
style="background:#ff5722"
onclick="cashPayment()">
Cash
</button>

<button
class="popupBtn"
style="background:red"
onclick="closePaymentPopup()">
Close
</button>

</div>

</div>

<!-- SALES POPUP -->

<div class="popup" id="salesPopup">

<div class="popupBox">

<h2>Sales Dashboard</h2>

<div style="margin-bottom:10px">

<input
type="date"
id="fromDate"
style="width:100%;padding:8px;margin-bottom:8px;">

<input
type="date"
id="toDate"
style="width:100%;padding:8px;">

<button
class="popupBtn"
style="background:#2196f3"
onclick="loadCustomSales()">
Search
</button>

</div>

<div id="salesData"></div>

<button
class="popupBtn"
style="background:red"
onclick="closeSalesPopup()">
Close
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
