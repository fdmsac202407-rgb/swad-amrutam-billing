<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swad Amrutam Billing</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

/* =========================
   LOGIN PAGE
========================= */

#loginPage{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

background:
linear-gradient(
135deg,
#0f2027,
#203a43,
#2c5364
);

}

.loginBox{

width:100%;
max-width:380px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(20px);

padding:35px;

border-radius:25px;

box-shadow:
0 0 30px rgba(0,0,0,0.4);

border:
1px solid rgba(255,255,255,0.1);

}

.logo{

text-align:center;
margin-bottom:15px;

}

.logo img{

width:140px;
height:140px;
object-fit:contain;

}

.loginTitle{

text-align:center;
font-size:32px;
font-weight:bold;

}

.subTitle{

text-align:center;
color:#cccccc;
margin-top:5px;
margin-bottom:25px;

}

.loginBox input{

width:100%;

padding:15px;

margin-top:15px;

border:none;
outline:none;

border-radius:14px;

background:rgba(255,255,255,0.1);

color:white;

font-size:16px;

}

.loginBox input::placeholder{
color:#dddddd;
}

.loginBtn{

width:100%;

padding:15px;

margin-top:25px;

border:none;

border-radius:14px;

background:
linear-gradient(
90deg,
#00c853,
#00e676
);

color:white;

font-size:18px;
font-weight:bold;

cursor:pointer;

transition:0.3s;

}

.loginBtn:hover{
transform:scale(1.03);
}

/* =========================
   BILLING PAGE
========================= */

#billingPage{
display:none;
padding:15px;
}

.mainTitle{
text-align:center;
margin-bottom:20px;
font-size:32px;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:#1f1f1f;
padding:15px;
border-radius:15px;
}

.cart{
background:#1f1f1f;
margin-top:20px;
padding:20px;
border-radius:15px;
}

.cart input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;
}

.cart button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
color:white;
}

.payBtn{
background:#00c853;
}

.whatsappBtn{
background:#25D366;
}

/* =========================
   PAYMENT POPUP
========================= */

#paymentOptions{

display:none;

position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.8);

justify-content:center;
align-items:center;

z-index:999;

}

.paymentBox{

background:#1f1f1f;

padding:25px;

border-radius:20px;

width:90%;
max-width:350px;

}

.paymentBox h2{
text-align:center;
margin-bottom:20px;
}

.paymentBox button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
color:white;
}

.upiBtn{
background:#00c853;
}

.qrBtn{
background:#ff9800;
}

.cashBtn{
background:#2196f3;
}

.closeBtn{
background:red;
}

/* =========================
   QR BOX
========================= */

#qrBox{
display:none;
text-align:center;
margin-top:20px;
}

#qrBox img{
width:220px;
border-radius:20px;
}

</style>

</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage">

<div class="loginBox">

<div class="logo">

<img src="https://www.smergers.com/media/franchiselogos/Swad_Amrutam_Chai_Logo.png">

</div>

<div class="loginTitle">
SWAD AMRUTAM CHAI
</div>

<div class="subTitle">
Central Billing System
</div>

<input
type="number"
id="customerId"
placeholder="Enter Customer ID"
>

<input
type="text"
id="username"
placeholder="Enter Username"
>

<input
type="password"
id="password"
placeholder="Enter Password"
>

<button
class="loginBtn"
onclick="login()"
>
LOGIN
</button>

</div>

</div>

<!-- =========================
     BILLING PAGE
========================= -->

<div id="billingPage">

<h1 class="mainTitle">
☕ Swad Amrutam Billing
</h1>

<div class="menu" id="menu"></div>

<div class="cart">

<h2>🛒 Cart</h2>

<div id="cart-items"></div>

<h2>
Total: ₹<span id="total">0</span>
</h2>

<input
type="text"
id="customerName"
placeholder="Customer Name"
>

<input
type="number"
id="customerNumber"
placeholder="Customer WhatsApp Number"
>

<button
class="payBtn"
onclick="payNow()"
>
Pay Now
</button>

<button
class="whatsappBtn"
onclick="sendWhatsApp()"
>
Send WhatsApp Bill
</button>

<div id="qrBox">

<h3 style="margin-bottom:15px;">
Scan QR To Pay
</h3>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=upi://pay?pa=rajput.ankit101-3@okicici">

</div>

</div>

</div>

<!-- =========================
     PAYMENT OPTIONS
========================= -->

<div id="paymentOptions">

<div class="paymentBox">

<h2>Select Payment</h2>

<button
class="upiBtn"
onclick="payUPI()"
>
UPI Payment
</button>

<button
class="qrBtn"
onclick="showQR()"
>
QR Payment
</button>

<button
class="cashBtn"
onclick="cashPayment()"
>
Cash Payment
</button>

<button
class="closeBtn"
onclick="closePayment()"
>
Close
</button>

</div>

</div>

<script>

/* =========================
   LOGIN SYSTEM
========================= */

function login() {

const customerId =
document.getElementById('customerId').value;

const username =
document.getElementById('username').value;

const password =
document.getElementById('password').value;

/* DEMO LOGIN */

if (

customerId === '101' &&

username === 'nikolmanager' &&

password === '1234'

) {

localStorage.setItem(
'customerId',
customerId
);

localStorage.setItem(
'username',
username
);

document.getElementById('loginPage').style.display =
'none';

document.getElementById('billingPage').style.display =
'block';

return;

}

alert('Invalid Login');

}

/* =========================
   ITEMS
========================= */

const items = [

{
name: "Amrutam Special Tea",
price: 10,
image: "https://swadamrutamchai.com/wp-content/uploads/2025/10/1.-AMRUTAM-S.P-TEA-scaled-1.jpg"
},

{
name: "Masala Tea",
price: 20,
image: "https://swadamrutamchai.com/wp-content/uploads/2025/10/7.-MASALA-MILK-scaled-1-2048x1414.jpg"
},

{
name: "Adrak Tea",
price: 20,
image: "https://swadamrutamchai.com/wp-content/uploads/2025/10/2.-GENGER-TEA.jpg"
},

{
name: "Coffee",
price: 20,
image: "https://swadamrutamchai.com/wp-content/uploads/2025/10/8.-COFFE-scaled-1.jpg"
},

{
name: "Cold Coffee",
price: 29,
image: "https://swadamrutamchai.com/wp-content/uploads/2025/10/14.-COLD-COFFEE-scaled-1.jpg"
},

{
name: "Oreo Milkshake",
price: 89,
image: "https://swadamrutamchai.com/wp-content/uploads/2025/10/21.-OREO-SHAKE.jpg"
}

];

const menu =
document.getElementById('menu');

const cartItems =
document.getElementById('cart-items');

const totalElement =
document.getElementById('total');

let cart = [];

/* =========================
   MENU
========================= */

items.forEach((item,index)=>{

const card =
document.createElement('div');

card.className = 'card';

card.innerHTML = `

<img src="${item.image}" style="
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
">

<h3 style="
margin-top:15px;
">
${item.name}
</h3>

<p style="
font-size:22px;
color:#00e676;
margin-top:10px;
font-weight:bold;
">
₹${item.price}
</p>

<div id="controls-${index}">

<button onclick="addToCart('${item.name}',${index})"
style="
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:black;
color:white;
font-size:18px;
margin-top:10px;
cursor:pointer;
">
Add
</button>

</div>

`;

menu.appendChild(card);

});

/* =========================
   ADD TO CART
========================= */

function addToCart(itemName,index){

const item =
items.find(i=>i.name===itemName);

const existing =
cart.find(c=>c.name===item.name);

if(existing){

existing.qty += 1;

}else{

cart.push({
...item,
qty:1
});

}

updateControls(itemName,index);

renderCart();

}

/* =========================
   CHANGE QTY
========================= */

function changeQty(itemName,change,index){

const item =
cart.find(c=>c.name===itemName);

item.qty += change;

if(item.qty <= 0){

cart =
cart.filter(c=>c.name!==itemName);

}

updateControls(itemName,index);

renderCart();

}

/* =========================
   UPDATE BUTTONS
========================= */

function updateControls(itemName,index){

const cartItem =
cart.find(c=>c.name===itemName);

const controls =
document.getElementById(`controls-${index}`);

if(!cartItem){

controls.innerHTML = `

<button onclick="addToCart('${itemName}',${index})"
style="
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:black;
color:white;
font-size:18px;
margin-top:10px;
cursor:pointer;
">
Add
</button>

`;

return;

}

controls.innerHTML = `

<div style="
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-top:10px;
">

<button onclick="changeQty('${itemName}',-1,${index})"
style="
width:40px;
height:40px;
border:none;
border-radius:50%;
background:red;
color:white;
font-size:22px;
cursor:pointer;
">
-
</button>

<span style="
font-size:22px;
font-weight:bold;
">
${cartItem.qty}
</span>

<button onclick="changeQty('${itemName}',1,${index})"
style="
width:40px;
height:40px;
border:none;
border-radius:50%;
background:green;
color:white;
font-size:22px;
cursor:pointer;
">
+
</button>

</div>

`;

}

/* =========================
   RENDER CART
========================= */

function renderCart(){

cartItems.innerHTML = '';

let total = 0;

cart.forEach(item=>{

total += item.price * item.qty;

const div =
document.createElement('div');

div.style.background = '#2a2a2a';
div.style.padding = '15px';
div.style.borderRadius = '12px';
div.style.marginTop = '10px';

div.innerHTML = `

<div style="
display:flex;
justify-content:space-between;
align-items:center;
">

<div>

<b>${item.name}</b>

<br>

₹${item.price} x ${item.qty}

</div>

<div style="
font-size:20px;
font-weight:bold;
color:#00e676;
">
₹${item.price * item.qty}
</div>

</div>

`;

cartItems.appendChild(div);

});

totalElement.textContent = total;

}

/* =========================
   PAYMENT
========================= */

function payNow(){

if(cart.length===0){

alert('Cart is Empty');

return;

}

document.getElementById('paymentOptions').style.display =
'flex';

}

function closePayment(){

document.getElementById('paymentOptions').style.display =
'none';

}

function payUPI(){

let total = 0;

cart.forEach(item=>{

total += item.price * item.qty;

});

const upi =
`upi://pay?pa=rajput.ankit101-3@okicici&pn=Swad Amrutam&am=${total}&cu=INR`;

window.location.href = upi;

}

function showQR(){

document.getElementById('qrBox').style.display =
'block';

closePayment();

}

function cashPayment(){

alert('Cash Payment Selected');

closePayment();

}

/* =========================
   WHATSAPP BILL
========================= */

function sendWhatsApp(){

const number =
document.getElementById('customerNumber').value;

if(!number){

alert('Enter Customer WhatsApp Number');

return;

}

let total = 0;

let message =
'🧾 *SWAD AMRUTAM* %0A%0A';

cart.forEach(item=>{

message +=
'☕ ' +
item.name +
' x ' +
item.qty +
' = ₹' +
(item.price * item.qty) +
'%0A';

total += item.price * item.qty;

});

message +=
'%0A💰 *Total: ₹' +
total +
'*%0A%0A🙏 Thank You';

window.open(
`https://wa.me/91${number}?text=${message}`
);

}

</script>

</body>

</html>
