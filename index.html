<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swad Amrutam Billing</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

/* LOGIN */

#loginPage{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
padding:20px;
}

.loginBox{
width:100%;
max-width:380px;
background:rgba(255,255,255,.08);
padding:30px;
border-radius:20px;
backdrop-filter:blur(15px);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:130px;
}

.loginTitle{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:10px;
}

.loginBox input{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
font-size:16px;
}

.loginBtn{
width:100%;
padding:14px;
margin-top:15px;
background:#00c853;
border:none;
border-radius:10px;
color:white;
font-size:18px;
cursor:pointer;
}

/* BILLING */

#billingPage{
display:none;
height:100vh;
}

.topBar{
height:60px;
background:#000;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

.logoutBtn{
background:red;
border:none;
color:white;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

.container{
display:flex;
height:calc(100vh - 60px);
}

/* SIDEBAR */

.sidebar{
width:220px;
background:#1b1b1b;
padding:15px;
overflow:auto;
}

.sidebar h2{
margin-bottom:15px;
}

.categoryBtn{
width:100%;
padding:12px;
margin-bottom:10px;
background:#00c853;
border:none;
color:white;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

/* PRODUCTS */

.products{
flex:1;
padding:15px;
overflow:auto;
}

.productGrid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:15px;
}

.card{
background:#1f1f1f;
padding:12px;
border-radius:15px;
text-align:center;
cursor:pointer;
}

.card h3{
font-size:16px;
margin-top:10px;
}

.card p{
color:#00e676;
font-weight:bold;
margin-top:5px;
}

/* CART */

.cart{
width:350px;
background:#181818;
padding:15px;
overflow:auto;
}

.cart h2{
margin-bottom:15px;
}

.cartItem{
background:#2a2a2a;
padding:10px;
margin-bottom:10px;
border-radius:10px;
}

.totalBox{
margin-top:15px;
font-size:22px;
font-weight:bold;
}

.cart input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
}

.actionBtn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
color:white;
font-size:16px;
cursor:pointer;
}

.saveBtn{
background:#2196f3;
}

.payBtn{
background:#ff9800;
}

.whatsappBtn{
background:#25D366;
}

/* POPUP */

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
justify-content:center;
align-items:center;
z-index:999;
}

.popupBox{
background:#222;
padding:20px;
border-radius:15px;
width:300px;
text-align:center;
}

.popupBtn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
color:white;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

<div class="loginBox">

<div class="logo">
<img src="https://www.smergers.com/media/franchiselogos/Swad_Amrutam_Chai_Logo.png">
</div>

<div class="loginTitle">
SWAD AMRUTAM CHAI
</div>

<input type="number" id="customerId" placeholder="Customer ID">

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button class="loginBtn" onclick="login()">
LOGIN
</button>

</div>

</div>

<!-- BILLING -->

<div id="billingPage">

<div class="topBar">

<h2>☕ Swad Amrutam Billing</h2>

<button class="logoutBtn" onclick="logout()">
Logout
</button>

</div>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<h2>Categories</h2>

<button class="categoryBtn"
onclick="showCategory('Tea Products')">
Tea Products
</button>

<button class="categoryBtn"
onclick="showCategory('Hot Products')">
Hot Products
</button>

<button class="categoryBtn"
onclick="showCategory('Cold Products')">
Cold Products
</button>

<button class="categoryBtn"
onclick="showCategory('Milkshake')">
Shakes
</button>

<button class="categoryBtn"
onclick="showCategory('Snacks')">
Snacks
</button>

</div>

<!-- PRODUCTS -->

<div class="products">

<div id="productGrid"
class="productGrid">

</div>

</div>

<!-- CART -->

<div class="cart">

<h2>🛒 Cart</h2>

<div id="cartItems"></div>

<div class="totalBox">
Total ₹<span id="total">0</span>
</div>

<input
type="text"
id="customerName"
placeholder="Customer Name">

<input
type="number"
id="customerNumber"
placeholder="WhatsApp Number">

<button
class="actionBtn saveBtn"
onclick="saveBill()">
Save Bill
</button>

<button
class="actionBtn payBtn"
onclick="openPaymentPopup()">
Payment Mode
</button>

<button
class="actionBtn whatsappBtn"
onclick="sendWhatsApp()">
WhatsApp Bill
</button>

</div>

</div>

</div>

<!-- SIZE POPUP -->

<div class="popup" id="sizePopup">

<div class="popupBox">

<h2>Select Option</h2>

<div id="sizeOptions"></div>

<button
class="popupBtn"
style="background:red"
onclick="closeSizePopup()">
Close
</button>

</div>

</div>

<!-- PAYMENT POPUP -->

<div class="popup" id="paymentPopup">

<div class="popupBox">

<h2>Payment Mode</h2>

<button
class="popupBtn"
style="background:#00c853"
onclick="payUPI()">
UPI
</button>

<button
class="popupBtn"
style="background:#9c27b0"
onclick="showQR()">
QR
</button>

<button
class="popupBtn"
style="background:#ff5722"
onclick="cashPayment()">
Cash
</button>

<button
class="popupBtn"
style="background:red"
onclick="closePaymentPopup()">
Close
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
