<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swad Amrutam Billing</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

/* LOGIN PAGE */

#loginPage{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.loginBox{
width:100%;
max-width:380px;
background:rgba(255,255,255,0.08);
padding:35px;
border-radius:25px;
backdrop-filter:blur(15px);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:140px;
}

.loginTitle{
text-align:center;
font-size:30px;
font-weight:bold;
margin-bottom:5px;
}

.subTitle{
text-align:center;
color:#ccc;
margin-bottom:20px;
}

.loginBox input{
width:100%;
padding:14px;
margin-top:14px;
border:none;
border-radius:12px;
font-size:16px;
outline:none;
}

.loginBtn{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:12px;
background:#00c853;
color:white;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

/* BILLING PAGE */

<button onclick="logout()"
style="
background:red;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
margin-bottom:15px;
cursor:pointer;
">
Logout
</button>

#billingPage{
display:none;
padding:15px;
}

.mainTitle{
text-align:center;
font-size:34px;
margin-bottom:20px;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:#1f1f1f;
padding:15px;
border-radius:18px;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
}

.card h3{
margin-top:12px;
}

.price{
font-size:24px;
color:#00e676;
margin-top:10px;
font-weight:bold;
}

.addBtn{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:black;
color:white;
font-size:18px;
cursor:pointer;
}

.qtyBox{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-top:12px;
}

.qtyBtn{
width:40px;
height:40px;
border:none;
border-radius:50%;
font-size:22px;
color:white;
cursor:pointer;
}

.minus{
background:red;
}

.plus{
background:green;
}

.cart{
background:#1f1f1f;
margin-top:20px;
padding:20px;
border-radius:18px;
}

.cartItem{
background:#2a2a2a;
padding:15px;
border-radius:12px;
margin-top:10px;
}

.cart input{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
font-size:16px;
}

.cart button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
color:white;
}

.saveBtn{
background:#2196f3;
}

.paymentBtn{
background:#ff9800;
}

.whatsappBtn{
background:#25D366;
}

/* PAYMENT POPUP */

.paymentPopup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
z-index:999;
}

.popupBox{
background:#1f1f1f;
padding:25px;
border-radius:20px;
width:90%;
max-width:350px;
text-align:center;
}

.popupBox button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
color:white;
font-weight:bold;
}

.upiBtn{
background:#00c853;
}

.qrBtn{
background:#9c27b0;
}

.cashBtn{
background:#f44336;
}

.closeBtn{
background:#555;
}

.qrImage{
display:none;
text-align:center;
margin-top:20px;
}

.qrImage img{
width:250px;
background:white;
padding:10px;
border-radius:15px;
}

</style>

</head>

<body>

<div id="loginPage">

<div class="loginBox">

<div class="logo">

<img src="https://www.smergers.com/media/franchiselogos/Swad_Amrutam_Chai_Logo.png">

</div>

<div class="loginTitle">
SWAD AMRUTAM CHAI
</div>

<div class="subTitle">
Central Billing System
</div>

<input type="number"
id="customerId"
placeholder="Customer ID">

<input type="text"
id="username"
placeholder="Username">

<input type="password"
id="password"
placeholder="Password">

<button
type="button"
class="loginBtn"
onclick="login()">

LOGIN

</button>

</div>

</div>

<div id="billingPage">

<h1 class="mainTitle">
☕ Swad Amrutam Billing
</h1>

<div class="menu" id="menu"></div>

<div class="cart">

<h2>🛒 Cart</h2>

<div id="cart-items"></div>

<h2 style="margin-top:20px;">
Total: ₹<span id="total">0</span>
</h2>

<input type="text"
id="customerName"
placeholder="Customer Name">

<input type="number"
id="customerNumber"
placeholder="WhatsApp Number">

<button class="saveBtn"
onclick="saveBill('Saved')">

Save Bill

</button>

<button class="paymentBtn"
onclick="openPaymentPopup()">

Payment Mode

</button>

<button class="whatsappBtn"
onclick="sendWhatsApp()">

Send WhatsApp Bill

</button>

<div class="qrImage"
id="qrImage">

<h2>Scan QR To Pay</h2>

<br>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=rajput.ankit101-3@okicici&pn=Swad%20Amrutam">

</div>

</div>

</div>

<div class="paymentPopup"
id="paymentPopup">

<div class="popupBox">

<h2>Select Payment Mode</h2>

<button class="upiBtn"
onclick="payUPI()">

UPI Payment

</button>

<button class="qrBtn"
onclick="showQR()">

QR Payment

</button>

<button class="cashBtn"
onclick="cashPayment()">

Cash Payment

</button>

<button class="closeBtn"
onclick="closePaymentPopup()">

Close

</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
